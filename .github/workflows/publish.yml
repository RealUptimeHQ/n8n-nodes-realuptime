# Publishes the package to npm with a provenance statement when a version
# tag (for example 0.2.0) is pushed. n8n requires verified community nodes
# to be published this way.
#
# npm authenticates this workflow through trusted publishing (OIDC): the
# package's settings on npmjs.com name RealUptimeHQ/n8n-nodes-realuptime and
# publish.yml as its trusted publisher, so no npm token is stored here.
#
# To release: bump "version" in package.json and CHANGELOG.md in a pull
# request, merge it, then push a tag equal to the version from main.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag matches package version
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      # Inside GitHub Actions, n8n-node release lints, builds and runs
      # npm publish with provenance.
      - name: Lint, build and publish with provenance
        run: npm run release
